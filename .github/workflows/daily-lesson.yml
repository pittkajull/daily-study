name: Publish daily technology brief

on:
  schedule:
    - cron: "0 1 * * *"  # 08:00 WIB
    - cron: "0 5 * * *"  # 12:00 WIB
    - cron: "0 9 * * *"  # 16:00 WIB
    - cron: "0 13 * * *" # 20:00 WIB
    - cron: "0 16 * * *" # 23:00 WIB
  workflow_dispatch:

concurrency:
  group: daily-study-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lesson from official RSS feeds
        run: python generate.py
      - name: Commit lesson
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "muhajirmamrullah1@gmail.com"
          git add lessons .cache
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: daily study activity"
          else
            git commit -m "lesson: daily technology brief"
          fi
          git push


