name: Publish daily technology brief

on:
  schedule:
    - cron: "0 1 */5 * *" # 08:00 WIB, setiap 5 hari pada tanggal 1, 6, 11, dst.
  workflow_dispatch:

concurrency:
  group: daily-study-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lesson from official RSS feeds
        run: python generate.py
      - name: Commit lesson
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "muhajirmamrullah1@gmail.com"
          git add lessons .cache
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: daily study activity"
          else
            git commit -m "lesson: daily technology brief"
          fi
          git push


